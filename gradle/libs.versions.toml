[versions]
agp = "9.4.0"
kotlin = "2.4.20"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
junit = "4.13.2"
# Phase 10: the playback engine and its media session (Q8). R9 found no permissively licensed player
# to adopt, but Media3 itself is Apache-2.0 and is what both the one credible look-alike and Google's
# own archived sample are built on.
media3 = "1.8.0"
# Phase 05 QA tooling (testapps/ime-fixture): the gesture driver is an instrumentation APK on UiAutomator.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
uiautomator = "2.4.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
