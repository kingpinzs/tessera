name: APK

# Build an installable APK on every push and attach it to a GitHub Release, so it can be downloaded
# straight onto the phone from the browser. A Release asset is used rather than an Actions artifact
# because an artifact is a zip behind a login, and a phone cannot install from that.
#
# The release tagged "latest" is moved on every push to main: bookmark its page and the newest build
# is always the top download.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The speech runtime and its two models are ~250 MB of pinned third-party release assets that are
      # deliberately not in git (tools/fetch-speech.sh, each file pinned by sha256). Cache the downloads
      # so only the first run on a given script pays for them.
      - name: Cache the speech payload
        uses: actions/cache@v4
        with:
          path: .speechsrc
          key: speech-${{ hashFiles('tools/fetch-speech.sh') }}

      - name: Fetch the speech runtime and models
        run: |
          python3 -m pip install --quiet sentencepiece
          bash tools/fetch-speech.sh

      # Phase 17 (BS-1): the panorama stitcher is linked from the official OpenCV Android SDK, a 319 MB pinned release
      # asset that is deliberately not in git (tools/fetch-opencv.sh, pinned by sha256). Cached like the speech payload.
      - name: Cache the OpenCV SDK
        uses: actions/cache@v4
        with:
          path: .opencvsrc
          key: opencv-${{ hashFiles('tools/fetch-opencv.sh') }}

      - name: Fetch the OpenCV SDK
        run: bash tools/fetch-opencv.sh

      # The one native library this project compiles (app/src/main/cpp, arm64-v8a only) needs the NDK and CMake at the
      # versions app/build.gradle.kts names. Without this step the phone build has no panorama.
      - name: NDK and CMake for the panorama library
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;3.31.6"

      # Phase 01 Decisions: "Phone installs are always release-signed and non-debuggable." The keystore
      # cannot live in git, so it comes from repository secrets. Without them the job still builds and
      # tests a debug APK and keeps it as a workflow artifact (behind a login, 30 days) — and PUBLISHES
      # NOTHING: the two release steps below run only for the release variant. A debug APK is debuggable,
      # trusts cleartext to the emulator's host and honours the QA base-URL prefs (the catalogue base
      # receives the TMDB token), so it never goes onto the public release page (phase 17 trust review C-M1).
      - name: Signing material
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "signed release build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=Nothing published::No signing secrets are set: this run builds a debug APK as a workflow artifact only. The release page is left as it was."
            {
              echo "### DEBUG BUILD — NOT PUBLISHED"
              echo
              echo "No signing secrets are set, so this is a **debug** APK. It is kept as a workflow artifact only;"
              echo "the release page is NOT updated by this run and still shows the last release-signed build."
              echo "Phase 01's Decisions say phone installs are always release-signed and non-debuggable."
              echo
              echo "To get a release build, add these repository secrets:"
              echo '- `KEYSTORE_BASE64` — `base64 -w0 release.jks`'
              echo '- `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build
        env:
          # The build number becomes the APK's versionCode, so each build is an update of the last one
          # rather than a reinstall of the same version (and a downgrade is refused, as it should be).
          TESSERA_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assemble${{ steps.signing.outputs.variant == 'release' && 'Release' || 'Debug' }} --console=plain

      # R4's spike is a separate, standalone APK (PLAN.md R4: "phone-only, standalone"). It rides the
      # same release so it can be installed from the phone's browser, and it is tiny next to the shell.
      - name: Build the R4 probe
        run: ./gradlew :r4probe:assembleDebug --console=plain

      - name: Name the APK
        id: apk
        run: |
          # The APK of the variant this run built, by its own output path - never "whichever APK is found first"
          # (phase 17 trust review C2-L6): a stale or other-variant APK in the outputs must not be the one published.
          variant="${{ steps.signing.outputs.variant }}"
          src="app/build/outputs/apk/$variant/app-$variant.apk"
          if [ ! -f "$src" ]; then
            echo "::error title=No APK::$src was not built"
            exit 1
          fi
          name="tessera-${{ github.run_number }}-$(git rev-parse --short HEAD)-${{ steps.signing.outputs.variant }}.apk"
          mkdir -p out && cp "$src" "out/$name"
          echo "path=out/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "- \`$name\` ($(du -h "out/$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # What is published must not be debuggable (C2-L6; phase 01: "phone installs are always release-signed and
      # non-debuggable"). Asked of the APK itself, not of the variant's name: the job fails here, before the release
      # page is touched, when the APK's own manifest says it is debuggable or cannot be read.
      - name: Refuse a debuggable APK
        if: ${{ steps.signing.outputs.variant == 'release' }}
        run: |
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          badging="$("$aapt2" dump badging "${{ steps.apk.outputs.path }}")"
          if [ -z "$badging" ] || printf '%s\n' "$badging" | grep -q '^application-debuggable'; then
            echo "::error title=Debuggable APK::The APK to publish is debuggable, or its badging could not be read. Nothing is published."
            exit 1
          fi
          echo "- not debuggable (aapt2 dump badging holds no application-debuggable line)" >> "$GITHUB_STEP_SUMMARY"

      # THE fingerprint, printed where a human will see it. A debug build is signed with
      # ~/.android/debug.keystore, which the Android Gradle Plugin GENERATES if it is missing — and a
      # CI runner is clean every time, so every debug build carries a different, random key. Android
      # then refuses to update one build with the next ("App not installed"), which is what Jeremy hit
      # on 2026-09-21 going from build 2 to build 3. Nothing about the failure says "different key", so
      # the key now says so itself, on the release page, before anyone downloads it.
      - name: Signing fingerprint
        id: fingerprint
        run: |
          signer="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          sha="$("$signer" verify --print-certs "${{ steps.apk.outputs.path }}" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          echo "sha256=${sha:-unknown}" >> "$GITHUB_OUTPUT"
          echo "- signing certificate SHA-256: \`${sha:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep it as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # The rolling "latest" release keeps ONE apk. Uploading adds assets rather than replacing them,
      # so without this the page collects one file per push — and with debug builds each of those is
      # signed with a different key, which is how you pick the wrong one and are told it is not
      # installed. A tagged release is left alone: those are meant to be permanent.
      # Release variant only: a debug run must not touch the release page at all, not even to empty it.
      - name: Clear the old assets from the rolling release
        if: ${{ steps.signing.outputs.variant == 'release' && !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          ids="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/latest" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(str(a['id']) for a in d.get('assets', [])))" || true)"
          for id in $ids; do
            echo "deleting old asset $id"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$id" || true
          done

      # A tag gets its own permanent release; a push to main moves the rolling "latest" one.
      # ONLY a release-signed build is published (C-M1): with the signing secrets absent this step is
      # skipped, on a push to main and on a tag alike, and the debug APK stays a workflow artifact.
      - name: Release
        if: ${{ steps.signing.outputs.variant == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Latest build ({0})', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Build ${{ github.run_number }} from ${{ github.sha }} (${{ steps.signing.outputs.variant }}).

            Signing certificate SHA-256: `${{ steps.fingerprint.outputs.sha256 }}`

            Release-signed: this installs straight over the previous build.

            Open this page on the phone and tap the `.apk` to install it. Sideloading needs
            "Install unknown apps" allowed for the browser, and the shell needs to be made the default
            Home and given the assistant role before Cortana will open.
          files: |
            ${{ steps.apk.outputs.path }}
            r4probe/build/outputs/apk/debug/r4probe-debug.apk
